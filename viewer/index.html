<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Roadmap · Fradelli</title>
    <link rel="icon" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="icon" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" sizes="48x48" href="icons/favicon-48.png" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="#/" class="brand" aria-label="Fradelli roadmap">
          <img src="icons/favicon-48.png" alt="" width="32" height="32" />
          <span class="brand-name">fradelli</span>
          <span class="muted small">roadmap</span>
        </a>
        <nav aria-label="Roadmap sections" class="tabs">
          <ul>
            <li><a href="#/" data-tab="overview">Overview</a></li>
            <li><a href="#/matrix" data-tab="matrix">Matrix</a></li>
            <li><a href="#/kanban" data-tab="kanban">Kanban</a></li>
            <li><a href="#/docs" data-tab="docs">Documents</a></li>
          </ul>
        </nav>
        <div class="header-end">
          <div class="search" role="search">
            <label class="sr-only" for="global-search">Search tasks, epics, or documents</label>
            <input id="global-search" type="search" placeholder="Search tasks, epics, or documents" autocomplete="off" />
            <kbd aria-hidden="true">/</kbd>
            <div id="search-results" class="card search-results" hidden></div>
          </div>
          <span id="live" class="live small muted" role="status" aria-live="polite">connecting</span>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <p class="muted">Loading the roadmap…</p>
    </main>
  </body>
</html>
